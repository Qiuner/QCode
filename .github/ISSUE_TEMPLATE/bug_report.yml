name: Bug 报告（中文）
description: 报告可稳定复现的错误或行为异常
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并提供能够复现问题的最少信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，确认没有重复报告。
          required: true
        - label: 我使用的是受支持的 Node.js、Yarn 和 Godot 版本。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - Web 小镇与居民面板
        - 教程流程
        - Godot 世界
        - Windows / macOS 启动器或发行包
        - DeepSeek Harness 集成
        - 构建或开发工具
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么，以及它对使用造成的影响。
      placeholder: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 打开……
        3. 点击……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写安装方式、版本或 commit、操作系统与芯片架构、浏览器；源码开发请补充 Node.js 版本。
      placeholder: |
        安装方式：源码 / Windows 安装包 / Windows 便携版 / macOS 便携版
        agent-isles 版本或 commit：
        操作系统版本与芯片架构：
        Node.js（源码开发）：
        浏览器：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请删除 API Key、访问令牌、本地路径及其他敏感信息后再粘贴。
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供最小复现仓库、录屏或其他有助于定位的信息。
