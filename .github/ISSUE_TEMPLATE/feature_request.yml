name: 功能建议（中文）
description: 提议新的能力或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，确认没有相同建议。
          required: true
        - label: 这个建议符合“在真实项目中由 AI 陪伴学习和创作”的产品方向。
          required: true

  - type: dropdown
    id: audience
    attributes:
      label: 主要受益者
      options:
        - 初次使用 AI 编程的学习者
        - 有经验的开发者
        - 教师或内容创作者
        - 项目维护者
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前场景和困难，不要只写希望增加的按钮或页面。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的用户流程和完成标准。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: scope
    attributes:
      label: 补充材料
      description: 可附草图、示例或相关项目链接。请勿包含敏感信息。
