name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test documentation sync checker
        run: node --test scripts/check-doc-i18n-sync.test.mjs

      - name: Verify Chinese and English documentation changed together
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_SYNC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-doc-i18n-sync.mjs "$DOC_SYNC_BASE" "$DOC_SYNC_HEAD"

  web:
    name: Web checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Verify pinned sources
        shell: pwsh
        run: |
          corepack yarn check:upstream
          corepack yarn check:vendored-runtime

      - name: Type-check and build Web plugin
        shell: pwsh
        run: |
          corepack yarn typecheck
          corepack yarn build:web

      - name: Run Web unit tests
        shell: pwsh
        run: node --test (Get-ChildItem packages/agent-isles-web/tests/*.test.mjs | ForEach-Object FullName)

      - name: Run Web supervisor and world shell tests
        shell: pwsh
        run: node --test apps/desktop/darwin-target.test.mjs apps/web/tests/supervise.test.mjs games/mosslight/tests/developer_panel.test.mjs scripts/world-export-state.test.mjs

  world:
    name: Godot world checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $destination
          $godot = Join-Path $destination 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path $godot)) { throw 'Godot console executable missing' }
          Add-Content -Path $env:GITHUB_ENV -Value "GODOT_BIN=$godot"

      - name: Import world resources
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path games/mosslight --editor --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test core world behavior
        shell: pwsh
        run: |
          foreach ($scenario in @('playthrough', 'residents', 'embedded_hud', 'camera_modes', 'garden_inventory', 'echo_discovery')) {
            & $env:GODOT_BIN --headless --path games/mosslight --fixed-fps 60 --script "res://tests/$scenario.gd"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test streamed neighbor regions
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path games/mosslight --fixed-fps 60 --script res://tests/region_loading.gd -- --stream-neighbors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
