<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#649c8c">
  <title>agent-isles</title>
  <link rel="icon" type="image/webp" href="cover.webp">
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #172d29; background: #649c8c; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { position: relative; width: 100%; height: 100svh; min-height: 360px; overflow: hidden; }
    nav { position: absolute; top: 24px; right: 28px; z-index: 2; display: flex; gap: 8px; }
    button { cursor: pointer; font: inherit; border: 0; border-radius: 6px; color: #172d29; background: #f4f7f3; }
    button:hover { background: #fff; }
    button:focus-visible { outline: 2px solid #172d29; outline-offset: 4px; }
    button:disabled { opacity: .65; cursor: progress; }
    nav button { width: 40px; height: 40px; font-size: 22px; background: #f4f7f3d9; position: relative; }
    nav button::after { content: attr(aria-label); position: absolute; right: 0; top: 48px; width: max-content; padding: 7px 10px; border-radius: 4px; font-size: 12px; color: #fff; background: #172d29; opacity: 0; pointer-events: none; }
    nav button:hover::after, nav button:focus-visible::after { opacity: 1; }
    #canvas { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; }
    #canvas:focus-visible { outline: 2px solid #c1d6a3; outline-offset: -3px; }
    #gate { position: absolute; inset: 0; background: #649c8c; }
    #gate[hidden] { display: none; }
    h1 { position: absolute; top: 7%; left: 24px; right: 24px; text-align: center; font-size: 56px; line-height: 1.2; font-weight: 500; margin: 0; }
    .entry { position: absolute; bottom: 5%; left: 24px; right: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #start { width: 168px; min-height: 48px; padding: 12px 20px; font-size: 14px; font-weight: 600; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #status { min-height: 40px; max-width: 360px; text-align: center; font-size: 12px; line-height: 1.7; }
    progress { position: absolute; bottom: -8px; width: min(240px, 100%); height: 2px; border: 0; background: #172d2930; accent-color: #172d29; }
    progress[hidden] { display: none; }
    progress::-webkit-progress-bar { background: #172d2930; }
    progress::-webkit-progress-value { background: #172d29; }
    #connection { position: absolute; bottom: 16px; left: 24px; right: 24px; margin: 0; text-align: center; color: #fff; font-size: 12px; pointer-events: none; }
    #connection:not(:empty) { background: #172d29e6; width: fit-content; max-width: calc(100% - 48px); margin: auto; padding: 8px 12px; border-radius: 4px; }
    dialog { width: min(440px, calc(100% - 32px)); max-height: calc(100svh - 48px); color: #172d29; background: #f4f7f3; border: 0; border-radius: 8px; padding: 28px; }
    dialog::backdrop { background: #10252080; }
    dialog h2 { margin: 0 0 24px; font-size: 20px; font-weight: 600; }
    dialog dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 14px; }
    dialog dt { color: #57645f; }
    dialog dd { margin: 0; text-align: right; }
    #close-guide { display: block; margin: 24px 0 0 auto; padding: 10px 16px; background: #172d29; color: #fff; }
    #pause-menu { width: min(340px, calc(100% - 32px)); padding: 28px; }
    #pause-menu::backdrop { background: #10252040; }
    #pause-menu h2 { margin-bottom: 8px; }
    #pause-menu p { color: #64726c; font-size: 13px; margin: 0 0 24px; }
    .pause-actions { display: grid; gap: 8px; }
    #pause-menu [hidden] { display: none; }
    .pause-actions button { min-height: 44px; padding: 10px 16px; }
    #pause-resume { color: #fff; background: #172d29; }
    #pause-settings label { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 0; }
    #pause-settings input { width: 18px; height: 18px; accent-color: #286657; }
    #pause-settings button { margin-top: 20px; }
    #pause-menu #pause-task { margin: 20px 0 0; font-size: 12px; }
    #developer-menu p { color: #64726c; font-size: 13px; line-height: 1.7; }
    #developer-talk, #developer-magic, #developer-cards, #developer-cups { background: #172d29; color: #fff; }
    main:fullscreen { height: 100vh; }
    body[data-embedded] nav { display: none; }
    body[data-embedded] main { min-height: 0; }
    @media (max-width: 600px) { nav { top: 16px; right: 16px; } h1 { top: 18%; font-size: 40px; } .art { object-fit: contain; height: 46%; top: 29%; } .entry { bottom: 7%; } }
    @media (max-height: 540px) and (min-width: 601px) { h1 { top: 24px; font-size: 36px; } .art { height: 85%; top: 2%; } .entry { bottom: 12px; gap: 6px; } #status { min-height: 20px; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="stage">
    <nav aria-label="世界选项"><button id="help" aria-label="操作指南">?</button><button id="fullscreen" aria-label="切换全屏">⛶</button></nav>
    <canvas id="canvas" width="1600" height="1000" tabindex="0" aria-label="苔光之屿游戏画面，使用 WASD 移动、空格跳跃">当前浏览器不支持画布，请使用新版 Chrome、Edge 或 Firefox。</canvas>
    <section id="gate" aria-label="进入游戏">
      <img class="art" src="cover.webp?v=2" srcset="cover.webp?v=2 1920w, cover-2560.webp 2560w, cover-3840.webp 3840w" sizes="100vw" width="3840" height="1564" alt="溪间庭院、苔光之屿和晴沙绿洲，由石桥相连的三个世界地块" fetchpriority="high">
      <h1>agent-isles</h1>
      <div class="entry">
        <button id="start">进入世界</button>
        <div id="status" role="status" aria-live="polite"></div>
        <progress id="progress" max="1" hidden aria-label="游戏加载进度"></progress>
      </div>
    </section>
    <p id="connection" role="status" aria-live="polite"></p>
  <dialog id="guide" aria-labelledby="guide-title"><h2 id="guide-title">操作指南</h2><dl><dt>移动 / 奔跑</dt><dd>WASD / Shift</dd><dt>跳跃 / 互动</dt><dd>空格 / E</dd><dt>切换视角</dt><dd>1 · 2 · 3 / V</dd><dt>观察 / 缩放</dt><dd>鼠标拖动 / 滚轮</dd><dt>拿出 / 放置回响</dt><dd>F（学会后可直接放置）</dd><dt>切换回响 / 木板转向</dt><dd>C / T</dd><dt>收起 / 撤回造物</dt><dd>鼠标右键 / Q</dd><dt>背包 / 水壶</dt><dd>I / G</dd><dt>隐藏界面 / 静音</dt><dd>Tab / M</dd><dt>环境 / 镜头动态</dt><dd>N / B</dd><dt>暂停 / 重新开始</dt><dd>Esc / R</dd></dl><button id="close-guide">关闭</button></dialog>
  </main>
  <script src="$GODOT_URL"></script>
  <script>
    const AGENT_ISLES_BRIDGE_VERSION = 1;
    const embedded = new URLSearchParams(location.search).get('embed') === '1';
    // The host and iframe must use the same loopback origin after a hard refresh.
    // Referrer is authoritative when the world is embedded; fall back to same-origin
    // for standalone previews.
    const parentOrigin = embedded && document.referrer ? new URL(document.referrer).origin : location.origin;
    if (embedded) document.body.dataset.embedded = '';
    let shellLocale = 'zh';
    const shellCopy = {
      zh: {
        worldOptions: '世界选项', guide: '操作指南', fullscreen: '切换全屏', canvas: '苔光之屿游戏画面，使用 WASD 移动、空格跳跃', unsupported: '当前浏览器不支持画布，请使用新版 Chrome、Edge 或 Firefox。', enterAria: '进入游戏', cover: '溪间庭院、苔光之屿和晴沙绿洲，由石桥相连的三个世界地块', enter: '进入世界', progress: '游戏加载进度', close: '关闭',
        guideTerms: ['移动 / 奔跑', '跳跃 / 互动', '切换视角', '观察 / 缩放', '拿出 / 放置回响', '切换回响 / 木板转向', '收起 / 撤回造物', '背包 / 水壶', '隐藏界面 / 静音', '环境 / 镜头动态', '暂停 / 重新开始'],
        guideValues: ['WASD / Shift', '空格 / E', '1 · 2 · 3 / V', '鼠标拖动 / 滚轮', 'F（学会后可直接放置）', 'C / T', '鼠标右键 / Q', 'I / G', 'Tab / M', 'N / B', 'Esc / R'],
        waiting: '等待主岛就绪', regionsReady: '邻近区域已开放', regionsFailed: '区域资源无法展开，请重新加载', preparing: name => `正在准备${name}的场景与画面…`, downloading: '正在下载区域…', server: status => `服务器返回 HTTP ${status}`, received: (mb, retry) => `已接收 ${mb} MB${retry ? ' · 重试中' : ''}`, corrupt: '区域文件不完整或格式错误', installing: '下载完成，正在展开区域…', timeout: '连接超时', disconnected: '网络连接中断', retrying: reason => `${reason}，正在重试…`, unavailable: reason => `${reason}，区域尚未开放`, pointer: '当前浏览器未允许锁定鼠标 · 按住左键或右键拖动观察',
        rest: '休息一下', paused: '已暂停', resume: '继续探索', options: '声音与画面', sound: '声音', nature: '环境动态', camera: '镜头动态', back: '返回', task: 'Q 仍在处理任务', developer: '开发者面板', developerHint: '直接预览角色演出，无需等待 AI 完成或自动召回。不会修改任务状态。', talk: '触发 Q 剧情对话', starlight: '掌中星光', cards: '飞牌归一', cups: '杯中奇遇', developerBack: '返回暂停菜单', reload: '重新加载', loadFailed: '加载失败，请检查网络与浏览器硬件加速后重试。', loading: '正在加载', loadingWorld: '正在加载世界', loadingPercent: value => `加载中 ${value}%`, entering: '正在进入世界', fullscreenFailed: '当前浏览器未允许全屏，可继续窗口游玩。'
      },
      en: {
        worldOptions: 'World options', guide: 'Controls', fullscreen: 'Toggle fullscreen', canvas: 'Mosslight Isle game. Move with WASD and jump with Space.', unsupported: 'Canvas is not supported. Use a recent version of Chrome, Edge, or Firefox.', enterAria: 'Enter game', cover: 'Streamside Garden, Mosslight Isle, and Sunlit Oasis connected by stone bridges', enter: 'Enter world', progress: 'Game loading progress', close: 'Close',
        guideTerms: ['Move / Run', 'Jump / Interact', 'Change view', 'Look / Zoom', 'Hold / Place echo', 'Switch echo / Rotate plank', 'Recall / Undo creation', 'Bag / Watering can', 'Hide UI / Mute', 'Environment / Camera motion', 'Pause / Restart'],
        guideValues: ['WASD / Shift', 'Space / E', '1 · 2 · 3 / V', 'Mouse drag / Wheel', 'F (place directly after learning)', 'C / T', 'Right-click / Q', 'I / G', 'Tab / M', 'N / B', 'Esc / R'],
        waiting: 'Waiting for the main island', regionsReady: 'Nearby regions are open', regionsFailed: 'Region assets could not be unpacked. Reload them.', preparing: name => `Preparing the scene and visuals for ${name}…`, downloading: 'Downloading regions…', server: status => `Server returned HTTP ${status}`, received: (mb, retry) => `Received ${mb} MB${retry ? ' · retrying' : ''}`, corrupt: 'The region file is incomplete or invalid', installing: 'Download complete. Unpacking regions…', timeout: 'Connection timed out', disconnected: 'Network connection interrupted', retrying: reason => `${reason}. Retrying…`, unavailable: reason => `${reason}. Region remains unavailable.`, pointer: 'Pointer lock was blocked · hold the left or right mouse button to drag the view',
        rest: 'Take a break', paused: 'Paused', resume: 'Continue exploring', options: 'Sound and visuals', sound: 'Sound', nature: 'Environmental motion', camera: 'Camera motion', back: 'Back', task: 'Q is still working', developer: 'Developer panel', developerHint: 'Preview character scenes directly without waiting for AI completion or automatic recall. Task state is unchanged.', talk: 'Trigger Q story dialogue', starlight: 'Starlight in Hand', cards: 'Cards Return as One', cups: 'Wonder in a Cup', developerBack: 'Back to pause menu', reload: 'Reload', loadFailed: 'Loading failed. Check the network and browser hardware acceleration, then retry.', loading: 'Loading', loadingWorld: 'Loading world', loadingPercent: value => `Loading ${value}%`, entering: 'Entering world', fullscreenFailed: 'Fullscreen was blocked. You can continue in the window.'
      }
    };
    const shell = key => shellCopy[shellLocale][key];
    function applyShellLocale(locale) {
      shellLocale = String(locale).startsWith('zh') ? 'zh' : 'en';
      document.querySelector('#stage > nav').ariaLabel = shell('worldOptions');
      document.getElementById('help').ariaLabel = shell('guide');
      document.getElementById('fullscreen').ariaLabel = shell('fullscreen');
      const canvas = document.getElementById('canvas'); canvas.ariaLabel = shell('canvas'); canvas.textContent = shell('unsupported');
      document.getElementById('gate').ariaLabel = shell('enterAria');
      document.querySelector('#gate .art').alt = shell('cover');
      document.getElementById('start').textContent = shell('enter');
      document.getElementById('progress').ariaLabel = shell('progress');
      document.getElementById('guide-title').textContent = shell('guide');
      document.querySelectorAll('#guide dt').forEach((node, index) => { node.textContent = shell('guideTerms')[index]; });
      document.querySelectorAll('#guide dd').forEach((node, index) => { node.textContent = shell('guideValues')[index]; });
      document.getElementById('close-guide').textContent = shell('close');
      if (document.getElementById('pause-menu')) {
        document.getElementById('pause-title').textContent = shell('rest');
        document.querySelector('#pause-menu > p').textContent = shell('paused');
        document.getElementById('pause-resume').textContent = shell('resume'); document.getElementById('pause-options').textContent = shell('options'); document.getElementById('pause-help').textContent = shell('guide');
        document.querySelector('#pause-sound').parentElement.firstChild.textContent = shell('sound'); document.querySelector('#pause-nature').parentElement.firstChild.textContent = shell('nature'); document.querySelector('#pause-camera').parentElement.firstChild.textContent = shell('camera'); document.getElementById('pause-back').textContent = shell('back'); document.getElementById('pause-task').textContent = shell('task');
        document.getElementById('developer-title').textContent = shell('developer'); document.querySelector('#developer-menu > p').textContent = shell('developerHint'); document.getElementById('developer-talk').textContent = shell('talk'); document.getElementById('developer-magic').textContent = shell('starlight'); document.getElementById('developer-cards').textContent = shell('cards'); document.getElementById('developer-cups').textContent = shell('cups'); document.getElementById('developer-close').textContent = shell('developerBack');
      }
    }
    const pendingHostMessages = [];
    let godotMessageHandler = null;
    window.agentIslesWorldBridge = {
      attachGodot(handler) {
        godotMessageHandler = handler;
        for (const message of pendingHostMessages.splice(0)) handler(JSON.stringify(message));
      },
      emit(type, payload) {
        if (window.parent === window) return;
        // Godot sends JSON strings; shell-originated events already use JS objects.
        if (typeof payload === 'string') payload = JSON.parse(payload);
        window.parent.postMessage({
          source: 'agent-isles-world', version: AGENT_ISLES_BRIDGE_VERSION, type, ...(payload === undefined ? {} : { payload })
        }, parentOrigin);
      }
    };
    window.addEventListener('message', event => {
      if (event.origin !== parentOrigin || event.source !== window.parent) return;
      const message = event.data;
      if (typeof message !== 'object' || message === null
        || message.source !== 'agent-isles-host'
        || message.version !== AGENT_ISLES_BRIDGE_VERSION) return;
      if (message.type === 'world:show-guide') {
        document.getElementById('guide').showModal();
        return;
      }
      if (message.type === 'world:init' || message.type === 'world:locale') applyShellLocale(message.payload?.locale);
      if (message.type === 'tutorial:keeper') {
        const payload = message.payload;
        if (!payload || typeof payload.encounterId !== 'string' || !/^[\w-]{1,160}$/.test(payload.encounterId)
          || !['arrive', 'home', 'cancel'].includes(payload.action) || typeof payload.reducedMotion !== 'boolean') return;
      }
      if (message.type === 'world:retry-neighbors') {
        window.loadNeighborRegions();
        return;
      }
      if (message.type === 'world:init' && window.neighborState) {
        window.agentIslesWorldBridge.emit('world:regions', window.neighborState);
      }
      if (message.type === 'world:init' && message.payload?.workspace) {
        document.title = `${message.payload.workspace.title} · agent-isles`;
      }
      if (godotMessageHandler) godotMessageHandler(JSON.stringify(message));
      else pendingHostMessages.push(message);
    });
    window.agentIslesWorldBridge.emit('world:ready');

    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    let loadingNeighbors = false;
    let neighborInstallTimeout;
    window.neighborState = { stage: 'waiting', detail: shell('waiting') };
    function reportNeighbors(stage, detail) {
      window.neighborState = { stage, detail };
      window.agentIslesWorldBridge.emit('world:regions', window.neighborState);
    }
    window.finishNeighborRegions = (ok) => {
      clearTimeout(neighborInstallTimeout);
      loadingNeighbors = false;
      reportNeighbors(ok ? 'ready' : 'failed', ok ? shell('regionsReady') : shell('regionsFailed'));
    };
    window.prepareNeighborRegion = (name) => {
      clearTimeout(neighborInstallTimeout);
      neighborInstallTimeout = setTimeout(() => window.finishNeighborRegions(false), 45000);
      reportNeighbors('installing', shell('preparing')(name));
    };
    window.loadNeighborRegions = async () => {
      if (loadingNeighbors || window.neighborState.stage === 'ready') return;
      const retry = window.neighborState.stage === 'failed';
      loadingNeighbors = true;
      reportNeighbors('downloading', shell('downloading'));
      setTimeout(() => godotMessageHandler?.(JSON.stringify({
        source: 'agent-isles-host', version: AGENT_ISLES_BRIDGE_VERSION, type: 'world:neighbors-started'
      })), 0);
      let type = 'world:neighbors-failed';
      let failure = '';
      for (let attempt = 0; attempt < 2; attempt++) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 45000);
        try {
          const response = await fetch('neighbors.pck', { signal: controller.signal, cache: retry || attempt ? 'reload' : 'default' });
          if (!response.ok) throw new Error(shell('server')(response.status));
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          let lastReported = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            if (received - lastReported >= 524288) {
              reportNeighbors('downloading', shell('received')((received / 1048576).toFixed(1), attempt));
              lastReported = received;
            }
          }
          const data = new Uint8Array(received);
          let offset = 0;
          for (const chunk of chunks) { data.set(chunk, offset); offset += chunk.length; }
          if (data.length < 100 || data[0] !== 71 || data[1] !== 68 || data[2] !== 80 || data[3] !== 67) {
            throw new Error(shell('corrupt'));
          }
          engine.copyToFS('/neighbors.pck', data);
          type = 'world:neighbors-downloaded';
          reportNeighbors('installing', shell('installing'));
          break;
        } catch (error) {
          failure = error.name === 'AbortError' ? shell('timeout') : (error instanceof TypeError ? shell('disconnected') : error.message);
          console.error('agent-isles region download failed:', error);
          if (attempt === 0) {
            reportNeighbors('downloading', shell('retrying')(failure));
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        } finally { clearTimeout(timeout); }
      }
      if (type === 'world:neighbors-failed') {
        loadingNeighbors = false;
        reportNeighbors('failed', shell('unavailable')(failure));
      } else {
        neighborInstallTimeout = setTimeout(() => window.finishNeighborRegions(false), 45000);
      }
      // Defer re-entry into Godot until the current WASM callback has returned.
      setTimeout(() => godotMessageHandler?.(JSON.stringify({
        source: 'agent-isles-host', version: AGENT_ISLES_BRIDGE_VERSION, type
      })), 0);
    };
    const canvas = document.getElementById('canvas');
    // Some embedded browsers reject pointer lock; dragging remains available.
    const requestPointerLock = canvas.requestPointerLock?.bind(canvas);
    const showMouseFallback = () => {
      document.getElementById('connection').textContent = shell('pointer');
    };
    if (requestPointerLock) {
      canvas.requestPointerLock = (...args) => {
        try { return Promise.resolve(requestPointerLock(...args)).catch(showMouseFallback); }
        catch (_) { showMouseFallback(); return Promise.resolve(); }
      };
    }
    document.addEventListener('pointerlockerror', showMouseFallback);
    const gate = document.getElementById('gate');
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const guide = document.getElementById('guide');
    const pause = document.createElement('dialog');
    pause.id = 'pause-menu';
    pause.setAttribute('aria-labelledby', 'pause-title');
    pause.innerHTML = `<h2 id="pause-title">休息一下</h2><p>已暂停</p><div id="pause-home" class="pause-actions"><button id="pause-resume" autofocus>继续探索</button><button id="pause-options">声音与画面</button><button id="pause-help">操作指南</button></div><div id="pause-settings" hidden><label>声音<input type="checkbox" id="pause-sound"></label><label>环境动态<input type="checkbox" id="pause-nature"></label><label>镜头动态<input type="checkbox" id="pause-camera"></label><div class="pause-actions"><button id="pause-back">返回</button></div></div><p id="pause-task" hidden>Q 仍在处理任务</p>`;
    document.body.appendChild(pause);
    let guideFromPause = false;
    const pauseHome = document.getElementById('pause-home');
    const pauseSettings = document.getElementById('pause-settings');
    const pauseAction = (action, extra = {}) => godotMessageHandler?.(JSON.stringify({ source: 'agent-isles-host', version: 1, type: 'world:pause-action', payload: { action, ...extra } }));
    const backToPause = () => { pauseSettings.hidden = true; pauseHome.hidden = false; document.getElementById('pause-title').textContent = shell('rest'); document.getElementById('pause-resume').focus(); };
    window.showIslandPause = state => {
      if (!state.open) { pause.close(); canvas.focus(); return; }
      document.getElementById('pause-sound').checked = !state.muted;
      document.getElementById('pause-nature').checked = state.nature;
      document.getElementById('pause-camera').checked = state.camera;
      if (!pause.open && !guideFromPause) { pause.showModal(); backToPause(); }
    };
    document.getElementById('pause-resume').onclick = () => pauseAction('resume');
    const developer = document.createElement('dialog');
    developer.id = 'developer-menu';
    developer.setAttribute('aria-labelledby', 'developer-title');
    developer.innerHTML = `<h2 id="developer-title">开发者面板</h2><p>直接预览角色演出，无需等待 AI 完成或自动召回。不会修改任务状态。</p><div class="pause-actions"><button id="developer-talk">触发 Q 剧情对话</button><button id="developer-magic">掌中星光</button><button id="developer-cards">飞牌归一</button><button id="developer-cups">杯中奇遇</button><button id="developer-close">返回暂停菜单</button></div>`;
    document.body.appendChild(developer);
    let developerClicks = 0;
    let developerLastClick = 0;
    document.addEventListener('pointerdown', event => {
      if (!started || !godotMessageHandler || developer.open || guide.open || document.pointerLockElement || event.button !== 0) return;
      // Match the lower-right blank area, including the pause dialog's backdrop.
      if (event.clientX < innerWidth * .85 || event.clientY < innerHeight * .75) {
        developerClicks = 0;
        return;
      }
      event.preventDefault();
      event.stopImmediatePropagation();
      const now = performance.now();
      developerClicks = now - developerLastClick <= 800 ? developerClicks + 1 : 1;
      developerLastClick = now;
      if (developerClicks < 5) return;
      developerClicks = 0;
      pauseAction('developer');
      pause.close();
      developer.showModal();
      document.getElementById('developer-talk').focus();
    }, true);
    const closeDeveloper = () => {
      developer.close();
      pause.showModal();
      backToPause();
    };
    document.getElementById('developer-close').onclick = closeDeveloper;
    developer.addEventListener('cancel', event => { event.preventDefault(); closeDeveloper(); });
    document.getElementById('developer-talk').onclick = () => {
      developer.close();
      pauseAction('preview-review');
      canvas.focus();
    };
    document.getElementById('developer-magic').onclick = () => {
      developer.close();
      pauseAction('preview-magic', { trick: 'starlight' });
      canvas.focus();
    };
    document.getElementById('developer-cards').onclick = () => {
      developer.close();
      pauseAction('preview-magic', { trick: 'cards' });
      canvas.focus();
    };
    document.getElementById('developer-cups').onclick = () => {
      developer.close();
      pauseAction('preview-magic', { trick: 'cups' });
      canvas.focus();
    };
    document.getElementById('pause-options').onclick = () => { pauseHome.hidden = true; pauseSettings.hidden = false; document.getElementById('pause-title').textContent = shell('options'); document.getElementById('pause-sound').focus(); };
    document.getElementById('pause-back').onclick = backToPause;
    for (const [id, action] of [['sound', 'mute'], ['nature', 'nature'], ['camera', 'camera']]) document.getElementById(`pause-${id}`).onchange = () => pauseAction(action);
    document.getElementById('pause-help').onclick = () => { guideFromPause = true; pause.close(); guide.showModal(); };
    pause.addEventListener('cancel', event => { event.preventDefault(); if (!pauseSettings.hidden) backToPause(); else pauseAction('resume'); });
    guide.addEventListener('close', () => { if (guideFromPause) { guideFromPause = false; pause.showModal(); backToPause(); } else if (started) canvas.focus(); });
    applyShellLocale(shellLocale);
    window.addEventListener('message', event => {
      if (event.origin !== parentOrigin || event.source !== window.parent || event.data?.source !== 'agent-isles-host' || event.data.version !== 1 || event.data.type !== 'world:init') return;
      document.getElementById('pause-task').hidden = !event.data.payload?.residents?.some(item => item.id === 'coder' && ['working', 'thinking'].includes(item.status));
    });
    let started = false;
    let failed = false;
    function reportFailure(error) {
      failed = true;
      started = false;
      gate.hidden = false;
      progress.hidden = true;
      start.disabled = false;
      start.textContent = shell('reload');
      status.textContent = shell('loadFailed');
      console.error('agent-isles failed to start:', error);
    }
    async function startGame() {
      if (started) return;
      if (failed) { location.reload(); return; }
      start.disabled = true;
      start.textContent = shell('loading');
      progress.hidden = false;
      status.textContent = shell('loadingWorld');
      performance.mark('world-start');
      try {
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) throw new Error(missing.join(', '));
        await engine.startGame({
          canvas,
          onProgress(current, total) {
            if (total > 0) {
              progress.value = current / total;
              status.textContent = current < total ? shell('loadingPercent')(Math.floor(current / total * 100)) : shell('entering');
            } else progress.removeAttribute('value');
          },
          onExit(code) { reportFailure(new Error(`Game stopped with code ${code}`)); }
        });
        started = true;
        performance.mark('world-playable');
        performance.measure('world-startup', 'world-start', 'world-playable');
        gate.hidden = true;
        canvas.focus();
        document.getElementById('connection').textContent = '';
        window.agentIslesWorldBridge.emit('world:playable');
      } catch (error) { reportFailure(error); }
    }
    start.addEventListener('click', startGame);
    if (embedded) void startGame();
    canvas.addEventListener('keydown', event => {
      if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
    });
    canvas.addEventListener('wheel', event => event.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    document.getElementById('help').addEventListener('click', () => guide.showModal());
    document.getElementById('close-guide').addEventListener('click', () => guide.close());
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.getElementById('stage').requestFullscreen();
        if (started) canvas.focus();
      } catch (_) { document.getElementById('connection').textContent = shell('fullscreenFailed'); }
    });
  </script>
</body>
</html>
